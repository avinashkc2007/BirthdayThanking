<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thank You! 🎉</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --bg-color: #0d0e15;
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --text-main: #ffffff;
            --text-dim: #a8b2d1;
            --card-bg: rgba(20, 21, 31, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* Prevent text selection on mobile */
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-color);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Canvas Backgrounds */
        #particles-canvas, #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        #confetti-canvas {
            z-index: 100;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .hidden-screen {
            pointer-events: none;
            opacity: 0 !important;
            visibility: hidden;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, opacity 0.8s ease;
            will-change: transform;
            opacity: 0;
            animation: fadeInCard 0.8s ease forwards;
        }
        
        .card > * {
            transform: translateZ(40px); /* 3D pop out effect inside the card */
            opacity: 0;
            animation: slideUp 0.6s ease forwards;
        }

        .card > *:nth-child(1) { animation-delay: 0.1s; }
        .card > *:nth-child(2) { animation-delay: 0.2s; }
        .card > *:nth-child(3) { animation-delay: 0.3s; }
        .card > *:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeInCard {
            from { opacity: 0; transform: translateY(20px) perspective(1000px); }
            to { opacity: 1; transform: translateY(0) perspective(1000px); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) translateZ(40px); }
            to { opacity: 1; transform: translateY(0) translateZ(40px); }
        }

        /* Loader */
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(0, 243, 255, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Typography & Layout Setup */
        .mt-3 { margin-top: 15px; }
        .mt-4 { margin-top: 25px; }
        .text-left { text-align: left; }
        .flex-col { display: flex; flex-direction: column; align-items: center; }

        /* Fallback Screen Inputs */
        .title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 25px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .name-input {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            background: rgba(0,0,0,0.4);
            color: white;
            font-size: 1.1rem;
            font-family: inherit;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
            text-align: center;
        }
        .name-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            background: rgba(0,0,0,0.6);
        }

        /* Buttons & Ripple */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(188, 19, 254, 0.4);
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 10px rgba(188, 19, 254, 0.3);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
            padding: 12px;
            font-size: 1rem;
            margin-top: 15px;
        }

        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            pointer-events: none;
            border-radius: 50%;
            animation: ripple-anim 0.6s ease-out;
        }
        @keyframes ripple-anim {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 400px; height: 400px; opacity: 0; }
        }

        /* Avatar */
        .avatar-container {
            animation: floatUpDown 4s ease-in-out infinite;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6), inset 0 0 10px rgba(0, 243, 255, 0.4);
            transition: transform 0.3s ease;
            /* Ghibli/Anime style photo filter: warm, vibrant, soft contrast */
            filter: contrast(1.15) saturate(1.7) sepia(0.2) brightness(1.1) hue-rotate(-5deg);
        }
        .avatar:active {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.9), inset 0 0 20px rgba(0, 243, 255, 0.4);
        }
        .avatar-label {
            margin-top: 12px;
            font-size: 0.85rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Message Typesetting */
        .message-line {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #d1d5db;
            min-height: 1.6rem; 
            font-weight: 300;
        }
        .message-line strong {
            color: white;
            font-weight: 600;
        }

        .thank-you {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neon-pulse 1.5s ease-in-out infinite alternate;
            margin-top: 30px;
        }
        @keyframes neon-pulse {
            0% { filter: drop-shadow(0 0 5px rgba(0,243,255,0.4)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 15px rgba(188, 19, 254, 0.8)); transform: scale(1.05); }
        }

        /* Visibility Handlers */
        .hide-element {
            display: none !important;
        }
        .fade-in {
            display: block; 
            animation: fadeIn 0.8s forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats {
            font-size: 0.95rem;
            color: var(--text-dim);
            font-weight: 300;
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>
    <canvas id="confetti-canvas"></canvas>

    <!-- Initial Loader -->
    <div id="loader-screen" class="screen">
        <div class="spinner"></div>
    </div>

    <!-- Fallback Screen -->
    <div id="fallback-screen" class="screen hidden-screen">
        <div class="card">
            <h1 class="title">Say Hello! 👋</h1>
            <input type="text" id="name-input" class="name-input" placeholder="Your Name (Required)" autocomplete="off">
            <input type="text" id="reg-input" class="name-input" placeholder="Register No. (Optional)" autocomplete="off" style="margin-top: -10px;">
            <button class="btn" id="continue-btn">Continue</button>
        </div>
    </div>

    <!-- Main Thank You Screen -->
    <div id="main-screen" class="screen hidden-screen">
        <div class="card" style="padding-top: 25px;">
            <div id="avatar-section" class="flex-col hide-element mb-4">
                <div class="avatar-container">
                    <img id="avatar-img" src="" alt="Avatar" class="avatar">
                </div>
                <div class="avatar-label">This is you 😄</div>
            </div>

            <div class="message-container text-left mt-4" style="margin-top: 25px;">
                <div id="line1" class="message-line"></div>
                <div id="line2" class="message-line mt-3"></div>
                <div id="line3" class="message-line"></div>
                <div id="line4" class="message-line mt-3"></div>
                <div id="thank-you" class="thank-you hide-element">THANK YOU ❤️</div>
            </div>

            <div id="footer-actions" class="hide-element mt-4 flex-col">
                <div class="stats">Messages received: <span id="rand-count"></span> ❤️</div>
                <button class="btn btn-outline" id="restart-btn">Restart</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let userName = "there";
        let avatarUrl = "";
        
        // Elements
        const screens = {
            loader: document.getElementById('loader-screen'),
            fallback: document.getElementById('fallback-screen'),
            main: document.getElementById('main-screen')
        };

        const showScreen = (screenName) => {
            Object.values(screens).forEach(s => s.classList.add('hidden-screen'));
            screens[screenName].classList.remove('hidden-screen');
        };

        // Utility: Touch Ripple Effect
        const addRipple = (e) => {
            const btn = e.currentTarget;
            const ripple = document.createElement("span");
            const rect = btn.getBoundingClientRect();
            // Fallback for touch vs mouse coords
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            ripple.classList.add("ripple");
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        };

        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('mousedown', addRipple);
            btn.addEventListener('touchstart', (e) => { addRipple(e); }, {passive: true});
        });

        // Initialize App
        const initApp = () => {
            const params = new URLSearchParams(window.location.search);
            const studentId = params.get('id');

            if (studentId && studentId.trim() !== '') {
                avatarUrl = `https://btechconnect.staloysius.edu.in/storage/photos/${studentId}.jpg`;
                const img = new Image();
                img.onload = () => {
                    document.getElementById('avatar-img').src = avatarUrl;
                    document.getElementById('avatar-section').classList.remove('hide-element');
                    showScreen('main');
                    startTypingSequence();
                };
                img.onerror = () => {
                    // Image fails -> fallback
                    showScreen('fallback');
                };
                img.src = avatarUrl;
            } else {
                showScreen('fallback');
            }
        };

        // Fallback Logic
        document.getElementById('continue-btn').addEventListener('click', () => {
            const nameVal = document.getElementById('name-input').value.trim();
            const regVal = document.getElementById('reg-input').value.trim();
            
            if (!nameVal) {
                const nameInput = document.getElementById('name-input');
                nameInput.style.borderColor = '#ff3366';
                setTimeout(() => nameInput.style.borderColor = 'rgba(0, 243, 255, 0.3)', 1500);
                return;
            }
            
            userName = nameVal;
            
            // Check if register number is provided and looks valid
            if (regVal && /^\d+$/.test(regVal)) {
                showScreen('loader');
                avatarUrl = `https://btechconnect.staloysius.edu.in/storage/photos/${regVal}.jpg`;
                const img = new Image();
                img.onload = () => {
                    document.getElementById('avatar-img').src = avatarUrl;
                    document.getElementById('avatar-section').classList.remove('hide-element');
                    showScreen('main');
                    startTypingSequence();
                };
                img.onerror = () => {
                    // Image fails -> treat as a regular name fallback without avatar
                    showScreen('main');
                    startTypingSequence();
                };
                img.src = avatarUrl;
            } else {
                // No reg number or invalid, standard main mode
                showScreen('main');
                startTypingSequence();
            }
        });

        // Typewriter Effect Variables & Skip Gesture
        let skipTyping = false;
        let touchStartY = 0;
        
        document.addEventListener('touchstart', e => touchStartY = e.touches[0].clientY, {passive:true});
        document.addEventListener('touchend', e => {
            if (touchStartY - e.changedTouches[0].clientY > 50) {
                // Swipe Up gesture detected
                skipTyping = true;
            }
        });

        const typeText = async (elementId, text, speed = 40) => {
            const el = document.getElementById(elementId);
            el.innerHTML = ''; 
            for(let i=0; i < text.length; i++){
                el.innerHTML += text.charAt(i);
                if (!skipTyping) {
                    await new Promise(r => setTimeout(r, speed));
                }
            }
        };

        const startTypingSequence = async () => {
            skipTyping = false;
            await new Promise(r => setTimeout(r, 600));
            
            await typeText('line1', `Hey ${userName} 👋`);
            if(!skipTyping) await new Promise(r => setTimeout(r, 400));
            
            await typeText('line2', "Your message really made my day special.");
            await typeText('line3', " Every single wish meant a lot to me.", 30);
            if(!skipTyping) await new Promise(r => setTimeout(r, 400));
            
            await typeText('line4', "I truly appreciate you taking your time to wish me.", 30);
            if(!skipTyping) await new Promise(r => setTimeout(r, 600));

            const ty = document.getElementById('thank-you');
            ty.classList.remove('hide-element');
            ty.classList.add('fade-in');

            setTimeout(() => {
                const counter = Math.floor(Math.random() * (250 - 50 + 1) + 50);
                document.getElementById('rand-count').innerText = counter;
                const footer = document.getElementById('footer-actions');
                footer.classList.remove('hide-element');
                footer.classList.add('fade-in');
                triggerConfetti();
            }, 800);
        };

        // Restart function
        document.getElementById('restart-btn').addEventListener('click', () => {
            window.location.href = window.location.pathname; // Clears ID for a full restart
        });

        // -------------------------
        // Particles Background (Subtle floaters)
        // -------------------------
        const canvasBg = document.getElementById('particles-canvas');
        const ctxBg = canvasBg.getContext('2d');
        let particles = [];
        
        const resizeBg = () => {
            canvasBg.width = window.innerWidth;
            canvasBg.height = window.innerHeight;
        };
        window.addEventListener('resize', resizeBg);
        resizeBg();

        class Particle {
            constructor() {
                this.x = Math.random() * canvasBg.width;
                this.y = Math.random() * canvasBg.height;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 0.5 + 0.1;
                this.color = `rgba(0, 243, 255, ${Math.random() * 0.3})`;
            }
            update() {
                this.y -= this.speed;
                // subtle drift
                this.x += Math.sin(this.y * 0.01) * 0.5;
                if (this.y < -10) {
                    this.y = canvasBg.height + 10;
                    this.x = Math.random() * canvasBg.width;
                }
            }
            draw() {
                ctxBg.fillStyle = this.color;
                ctxBg.beginPath();
                ctxBg.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctxBg.fill();
            }
        }

        for(let i=0; i<40; i++) particles.push(new Particle());

        const animateBg = () => {
            ctxBg.clearRect(0, 0, canvasBg.width, canvasBg.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateBg);
        };
        animateBg();

        // -------------------------
        // Confetti Effect
        // -------------------------
        const canvasConf = document.getElementById('confetti-canvas');
        const ctxConf = canvasConf.getContext('2d');
        let confettis = [];
        let confettiActive = false;

        const resizeConf = () => {
            canvasConf.width = window.innerWidth;
            canvasConf.height = window.innerHeight;
        };
        window.addEventListener('resize', resizeConf);
        resizeConf();

        const colors = ['#00f3ff', '#bc13fe', '#ff00ea', '#ffffff'];

        class ConfettiPiece {
            constructor() {
                this.x = canvasConf.width / 2;
                this.y = canvasConf.height / 2;
                this.size = Math.random() * 10 + 5;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 15 + 5;
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity - 10; // bias upward
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
                this.gravity = 0.5;
                this.opacity = 1;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                // fade out eventually
                if (this.y > canvasConf.height) {
                    this.opacity -= 0.02;
                }
            }
            draw() {
                ctxConf.save();
                ctxConf.globalAlpha = Math.max(0, this.opacity);
                ctxConf.translate(this.x, this.y);
                ctxConf.rotate((this.rotation * Math.PI) / 180);
                ctxConf.fillStyle = this.color;
                ctxConf.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctxConf.restore();
            }
        }

        const animateConfetti = () => {
            if(!confettiActive && confettis.length === 0) return;
            ctxConf.clearRect(0, 0, canvasConf.width, canvasConf.height);
            for(let i = confettis.length - 1; i >= 0; i--){
                const c = confettis[i];
                c.update();
                c.draw();
                if(c.opacity <= 0) {
                    confettis.splice(i, 1);
                }
            }
            requestAnimationFrame(animateConfetti);
        };

        const triggerConfetti = () => {
            confettis = [];
            for(let i=0; i<150; i++) confettis.push(new ConfettiPiece());
            confettiActive = true;
            animateConfetti();
            // Stop generating, but let existing fall
            setTimeout(() => { confettiActive = false; }, 100);
        };

        // -------------------------
        // 3D Motion & Parallax Tilt
        // -------------------------
        const handleTilt = (xVal, yVal) => {
            const activeCard = document.querySelector('.screen:not(.hidden-screen) .card');
            if (activeCard) {
                // Ensure smoothness while preserving 3D stack
                activeCard.style.transform = `perspective(1000px) rotateX(${yVal}deg) rotateY(${xVal}deg)`;
            }
        };

        window.addEventListener('mousemove', (e) => {
            const maxTilt = 10;
            const x = (e.clientX / window.innerWidth) * 2 - 1; 
            const y = (e.clientY / window.innerHeight) * 2 - 1;
            handleTilt(x * maxTilt, -y * maxTilt);
        });

        const requestGyro = () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(r => {}).catch(console.error);
            }
        };

        window.addEventListener('deviceorientation', (e) => {
            if(!e.beta || !e.gamma) return;
            const x = Math.min(Math.max(e.gamma / 2, -15), 15);
            const y = Math.min(Math.max((e.beta - 40) / 2, -15), 15);
            handleTilt(x, -y);
        });

        document.getElementById('continue-btn').addEventListener('click', requestGyro);

        // Start
        initApp();
    </script>
</body>
</html>
